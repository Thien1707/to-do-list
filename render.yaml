services:
  - type: web
    name: task-manager-backend
    runtime: node
    rootDir: server
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      # Bắt buộc: thêm trên Render Dashboard (Secret) — không commit mật khẩu vào repo
      # DB_HOST, DB_USER, DB_PASS, DB_NAME, DB_SSL=true, JWT_SECRET, JWT_REFRESH_SECRET, CLIENT_URL
